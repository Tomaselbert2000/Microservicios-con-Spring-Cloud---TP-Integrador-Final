spring.application.name=sale-microservice
server.port=8020
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
resilience4j.circuitbreaker.instances.cart-service.ignore-exceptions[0]=feign.FeignException.NotFound
resilience4j.retry.instances.cart-service.ignore-exceptions[0]=feign.FeignException.NotFound